name: CI

on:
  push:
    paths-ignore:
      - "README*.md"
      - "CHANGELOG.md"
      - "LICENSE"
      - ".docs/**"
      - "**.md"
  pull_request:
    paths-ignore:
      - "README*.md"
      - "CHANGELOG.md"
      - "LICENSE"
      - ".docs/**"
      - "**.md"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            ferry-runtime/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: npm ci
        working-directory: ferry-runtime
      - run: npm run format:check && npm run typecheck && npm test && npm run build
        working-directory: ferry-runtime
      - run: npm ci
        working-directory: app
      - run: npm run check:boundaries && npm run typecheck && npm test && npm run build
        working-directory: app
      - run: python -m pip install -r requirements-test.txt
      - run: python scripts/generate-contracts.py --check
      - run: python -m ruff check tests scripts
      - run: python -m pytest

  # 两个桌面目标各自原生编译；平台实现不能靠另一端的编译器“顺便”覆盖。
  rust-quality:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          components: rustfmt, clippy
          target: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            app/src-tauri -> target
            crates/ferry-engine -> target
          key: quality-macos
      - run: cargo fmt --check
        working-directory: app/src-tauri
      - run: cargo clippy --all-targets --locked -- -D warnings
        working-directory: app/src-tauri
      - run: cargo test --locked
        working-directory: app/src-tauri
      - run: cargo check --locked
        working-directory: app/src-tauri
      # ferry-engine 是独立 package（自带 Cargo.lock），必须单独跑一遍全套门禁。
      - run: cargo fmt --check
        working-directory: crates/ferry-engine
      - run: cargo clippy --all-targets --locked -- -D warnings
        working-directory: crates/ferry-engine
      - run: cargo test --locked
        working-directory: crates/ferry-engine
      - run: cargo check --locked
        working-directory: crates/ferry-engine

  rust-quality-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12b097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            app/src-tauri -> target
            crates/ferry-engine -> target
          key: quality-windows
      - run: cargo fmt --check
        working-directory: app/src-tauri
      - run: cargo clippy --all-targets --locked -- -D warnings
        working-directory: app/src-tauri
      - run: cargo test --locked
        working-directory: app/src-tauri
      - run: cargo fmt --check
        working-directory: crates/ferry-engine
      - run: cargo clippy --all-targets --locked -- -D warnings
        working-directory: crates/ferry-engine
      - run: cargo test --locked
        working-directory: crates/ferry-engine

  frozen-sidecar-windows:
    runs-on: windows-latest
    env:
      BUILD_TARGET: x86_64-pc-windows-msvc
      SIDECAR_ENGINE: app/src-tauri/binaries/ferry-engine-x86_64-pc-windows-msvc.exe
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ferry-runtime/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          target: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            app/src-tauri -> target
            crates/ferry-engine -> target
          key: frozen-x86_64-pc-windows-msvc
      - run: npm ci
        working-directory: ferry-runtime
      # SEA 必须在目标平台原生生成；脚本本身包含 runtime RPC smoke。
      - run: npm run build:sea -- "$env:BUILD_TARGET"
        working-directory: ferry-runtime
      - run: cargo build --release --locked --target "$env:BUILD_TARGET"
        working-directory: crates/ferry-engine
      - name: Place engine sidecar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force app/src-tauri/binaries | Out-Null
          Copy-Item "crates/ferry-engine/target/$env:BUILD_TARGET/release/ferry-engine.exe" `
            $env:SIDECAR_ENGINE
      - run: cargo check --locked --target "$env:BUILD_TARGET"
        working-directory: app/src-tauri
      - name: Frozen engine sidecar smoke
        shell: python
        env:
          SIDECAR: ${{ env.SIDECAR_ENGINE }}
        run: |
          import json, os, subprocess
          protocol = json.load(open("contracts/ipc.json", encoding="utf-8"))["protocol"]
          request = {
              "protocol": protocol, "id": "ci-health",
              "method": "health", "params": {},
          }
          process = subprocess.run(
              [os.environ["SIDECAR"], "rpc"],
              input=json.dumps(request) + "\n", text=True,
              capture_output=True, check=True, timeout=30)
          response = json.loads(process.stdout.split("\n", 1)[0])
          assert response["ok"] is True, (response, process.stderr)
          assert response["protocol"] == protocol, response
          assert response["result"]["service"] == "engine", response

  frozen-sidecar:
    runs-on: macos-14
    env:
      BUILD_TARGET: aarch64-apple-darwin
      SIDECAR_ENGINE: app/src-tauri/binaries/ferry-engine-aarch64-apple-darwin
      SIDECAR_RUNTIME: app/src-tauri/binaries/ferry-runtime-aarch64-apple-darwin
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # Python 只用于下面两个 smoke 步骤（shell: python），不再参与 sidecar 构建。
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ferry-runtime/package-lock.json
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          target: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            app/src-tauri -> target
            crates/ferry-engine -> target
          key: aarch64-apple-darwin
      - run: npm ci
        working-directory: ferry-runtime
      - run: npm run build:sea -- "$BUILD_TARGET"
        working-directory: ferry-runtime
      - run: cargo build --release --locked --target "$BUILD_TARGET"
        working-directory: crates/ferry-engine
      # 命名必须是 ferry-engine-<target>：tauri.conf.json 的 externalBin 依赖它。
      - name: Place engine sidecar
        run: |
          mkdir -p app/src-tauri/binaries
          cp "crates/ferry-engine/target/$BUILD_TARGET/release/ferry-engine" \
            "app/src-tauri/binaries/ferry-engine-$BUILD_TARGET"
      - run: cargo check --locked --target "$BUILD_TARGET"
        working-directory: app/src-tauri
      - run: cargo test --locked --target "$BUILD_TARGET"
        working-directory: app/src-tauri
      - name: Frozen sidecar smoke
        shell: python
        env:
          SIDECAR: ${{ env.SIDECAR_ENGINE }}
        run: |
          import json, os, subprocess
          protocol = json.load(open("contracts/ipc.json", encoding="utf-8"))["protocol"]
          expected_agents = {
              agent["id"]
              for agent in json.load(
                  open("contracts/agents.json", encoding="utf-8")
              )["agents"]
          }
          for method in ("health", "version", "env"):
              process = subprocess.run(
                  [os.environ["SIDECAR"], "rpc"],
                  input=json.dumps({
                      "protocol": protocol,
                      "id": f"ci-{method}",
                      "method": method,
                      "params": {},
                  }) + "\n",
                  text=True, capture_output=True, check=True, timeout=30)
              response = json.loads(process.stdout.split("\n", 1)[0])
              assert response["ok"], (method, response, process.stderr)
              if method == "health":
                  assert response["protocol"] == protocol, response
                  assert response["result"]["status"] == "ready", response
                  assert response["result"]["service"] == "engine", response
              elif method == "version":
                  assert response["result"], response
              else:
                  assert set(response["result"]) == expected_agents, response
      - name: Ferry Runtime sidecar smoke
        shell: python
        env:
          SIDECAR: ${{ env.SIDECAR_RUNTIME }}
        run: |
          import json, os, queue, subprocess, tempfile, threading
          protocol = json.load(open("contracts/ipc.json", encoding="utf-8"))["protocol"]
          request = {
              "protocol": protocol, "id": "ci-health",
              "method": "health", "params": {},
          }
          with tempfile.TemporaryDirectory() as data_dir:
              env = {**os.environ, "FERRY_RUNTIME_DATA_DIR": data_dir}
              process = subprocess.Popen(
                  [os.environ["SIDECAR"]], stdin=subprocess.PIPE,
                  stdout=subprocess.PIPE, stderr=subprocess.PIPE,
                  text=True, env=env)
              lines = queue.Queue()
              threading.Thread(
                  target=lambda: [lines.put(line) for line in process.stdout],
                  daemon=True).start()
              process.stdin.write(json.dumps(request) + "\n")
              process.stdin.flush()
              response = None
              try:
                  while response is None:
                      message = json.loads(lines.get(timeout=30))
                      if message.get("type") == "engine.request":
                          process.stdin.write(json.dumps({
                              "protocol": protocol,
                              "id": "ci-engine-result",
                              "method": "tool.result",
                              "params": {
                                  "request_id": message["payload"]["request_id"],
                                  "session_id": message["session_id"],
                                  "ok": True,
                                  "result": [],
                              },
                          }) + "\n")
                          process.stdin.flush()
                      elif message.get("id") == "ci-health":
                          response = message
              finally:
                  process.stdin.close()
                  process.terminate()
                  process.wait(timeout=10)
                  stderr = process.stderr.read()
          assert response["ok"] is True, (response, stderr)
          assert response["protocol"] == protocol, response
          assert response["result"]["service"] == "ferry-runtime", response
          assert response["result"]["provider"] == "deepseek", response
          assert response["result"]["model"] == "deepseek-v4-flash", response
