[package]
name = "ferry"
version = "0.8.6"
edition = "2021"

[lib]
name = "ferry_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-process = "2"
tauri-plugin-clipboard-manager = "2"
# 角色配置导入导出的系统文件对话框(路径只在 Rust 侧使用,不向 webview 开放文件系统)
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
# 记住用户手动调整过的窗口大小/位置,首启才用 tauri.conf.json 里的默认尺寸
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# GUI 启动(Finder/Dock)只继承 launchd 最小 PATH,启动时从登录 shell 恢复完整 PATH,
# 否则引擎子进程探测/执行 claude、codex、opencode 等 CLI 会找不到命令。Windows 上为 no-op。
fix-path-env = { git = "https://github.com/tauri-apps/fix-path-env-rs" }

[target.'cfg(target_os = "macos")'.dependencies]
# kill(pid, 0) 探测引擎 daemon 是否还活着(设置页「引擎服务」只读状态用)
libc = "0.2"
# 窗口层 NSVisualEffectView 毛玻璃(配合 tauri.macos.conf.json 的 transparent + macOSPrivateApi)
window-vibrancy = "0.6"
